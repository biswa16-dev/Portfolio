<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="circleView">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>
  <!-- Image is enlarged (120x120 instead of 100x100) and centered (-10 offset) -->
  <image width="120" height="120" x="-10" y="-10" href="data:image/png;base64," clip-path="url(#circleView)" />
</svg>